name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-msvc:
    name: Build MSVC release & package (NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 (MSVC 2022 x64)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Configure (MSVC, VS 2022 x64)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.dir }}"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test (ctest, Release)
        shell: pwsh
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage runtime dependencies (windeployqt)
        shell: pwsh
        run: |
          $exe = "build/Release/Multi-Controller.exe"
          & windeployqt --release --no-translations --no-opengl-sw "$exe"

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          if (Test-Path packaging/installer.nsi) {
            makensis -V2 packaging/installer.nsi
          } else {
            Write-Warning "packaging/installer.nsi not found - skipping NSIS packaging."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msvc-release-package
          path: build/Release/
          if-no-files-found: error

      - name: Upload installer as release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/*-setup.exe
            packaging/*-installer.exe
            packaging/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
